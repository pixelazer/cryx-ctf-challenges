<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyroeis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <h1>Pyroeis</h1>

    <form method="POST" action="" class="search_form">
        <h3>Search the catalog:</h3>
        <input type="text" name="q" placeholder="e.g. GPU"><br>
    </form>

    <div class="results">
        <h3>Results:</h3>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% elif results %}
        <!-- Note to frontend: SELECT [...] '%<query>%' -->
        <!-- expect 2 rows -->
            <table>
                <tr><th>Name</th><th>Category</th></tr>
                {% for sql_row in results %}
                <tr>
                {% for item in sql_row %}
                <td>{{ item }}</td>
                {% endfor %}
                </tr>
                {% endfor %}
            </table>
        {% else %}
            <p>No products found.</p>
        {% endif %}
    </div>
</body>
</html>
